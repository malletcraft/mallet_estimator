android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g
kotlin.code.style=official
# compileSdk 36 on AGP 8.7.3: the AGP release that KNOWS 36 is newer than
# ours, so AGP would fail the build with "compileSdk 36 requires AGP x".
# This property is the documented escape hatch; remove it when AGP moves.
android.suppressUnsupportedCompileSdk=36
