# Builds the sideloadable APK. No Play Console, no D-U-N-S, no human steps:
# push → artifact → install on the phone. Every build is signed with the
# COMMITTED sideload keystore so a new APK installs over the old one instead
# of demanding an uninstall that would wipe the offline queue. That keystore
# never touches Play; the Play upload key will live in a repo secret.
name: Android app (sideload APK)

on:
  workflow_dispatch:
  push:
    branches: [main, batch-next]
    paths: ["android/**", ".github/workflows/android-app.yml"]

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write        # main builds publish to the android-latest release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # -PwithApp is what includes the :app module at all — without it the
      # build is the pure-JVM projection contract and never needs the SDK.
      - name: Projection + naming contract first
        working-directory: android
        run: gradle :pano:test --console=plain
      # RELEASE, not debug. Managed Google Play refuses a debuggable APK
      # outright ('APK is marked as debuggable', 2026-08-17, at the private
      # app upload in the Workspace admin console) — and the release variant
      # is what phones should run anyway. Same committed keystore signs both,
      # so a release build still installs over a debug one.
      - name: Assemble
        working-directory: android
        run: gradle -PwithApp :app:assembleRelease :app:assembleDebug --console=plain
      - name: Rename with commit
        run: cp android/app/build/outputs/apk/release/app-release.apk
          "mcft-site-photos-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-site-photos-apk
          path: mcft-site-photos-*.apk
          retention-days: 30

      # The phone's door. An Actions artifact needs a GitHub login, arrives
      # zipped, and expires in 30 days — the wrong shape for "open this link
      # on the phone and tap install". A rolling release gives one permanent
      # URL that always serves the newest main build:
      #   https://github.com/malletcraft/mallet_estimator/releases/download/android-latest/mcft-site-photos.apk
      # main only: batch-next builds are for review, not for phones.
      - name: Publish to the android-latest release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mcft-site-photos-*.apk mcft-site-photos.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "MCFT Site Photos (sideload, rolling)" \
              --notes "Always the newest main build. Same signature every build, so it installs over the previous one."
          gh release upload android-latest mcft-site-photos.apk --clobber
          gh release edit android-latest \
            --notes "Always the newest main build (currently ${GITHUB_SHA::7}, $(date -u +%Y-%m-%dT%H:%MZ)). Same signature every build, so it installs over the previous one."
