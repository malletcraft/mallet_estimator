# Builds the sideloadable APK. No Play Console, no D-U-N-S, no human steps:
# push → artifact → install on the phone. Every build is signed with the
# COMMITTED sideload keystore so a new APK installs over the old one instead
# of demanding an uninstall that would wipe the offline queue. That keystore
# never touches Play; the Play upload key will live in a repo secret.
name: Android app (sideload APK)

on:
  workflow_dispatch:
  push:
    branches: [main, batch-next]
    paths: ["android/**", ".github/workflows/android-app.yml"]

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # -PwithApp is what includes the :app module at all — without it the
      # build is the pure-JVM projection contract and never needs the SDK.
      - name: Projection + naming contract first
        working-directory: android
        run: gradle :pano:test --console=plain
      - name: Assemble
        working-directory: android
        run: gradle -PwithApp :app:assembleDebug --console=plain
      - name: Rename with commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk
          "mcft-site-photos-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-site-photos-apk
          path: mcft-site-photos-*.apk
          retention-days: 30
