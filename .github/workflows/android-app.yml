# Builds the sideloadable APK. No Play Console, no D-U-N-S, no human steps:
# push → artifact → install on the phone. Every build is signed with the
# COMMITTED sideload keystore so a new APK installs over the old one instead
# of demanding an uninstall that would wipe the offline queue. That keystore
# never touches Play; the Play upload key will live in a repo secret.
name: Android app (sideload APK)

on:
  workflow_dispatch:
  push:
    branches: [main, batch-next]
    paths: ["android/**", ".github/workflows/android-app.yml"]

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write        # main builds publish to the android-latest release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # -PwithApp is what includes the :app module at all — without it the
      # build is the pure-JVM projection contract and never needs the SDK.
      - name: Projection + naming contract first
        working-directory: android
        run: gradle :pano:test --console=plain
      # RELEASE, not debug. Managed Google Play refuses a debuggable APK
      # outright ('APK is marked as debuggable', 2026-08-17, at the private
      # app upload in the Workspace admin console).
      #
      # The upload key exists ONLY as repo secrets. A main build without it
      # REFUSES to continue rather than falling back to the dev key: the
      # signature Play learns on first upload is the signature forever, and a
      # build that quietly flip-flops keys strands every installed device.
      - name: Unpack the release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MCFT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "release key present"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::main build with no ANDROID_KEYSTORE_B64 secret — refusing to publish a wrongly-signed APK"
            exit 1
          else
            echo "no release key (non-main build) — dev-key fallback"
          fi
      # Monotonic version from the run number: Play refuses a versionCode
      # that is not strictly higher than the last, and hands-off publishing
      # means nobody is around to bump one. Base 100 clears every manually
      # numbered build that came before.
      - name: Version from run number
        run: |
          echo "MCFT_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "MCFT_VERSION_NAME=0.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Assemble
        working-directory: android
        env:
          MCFT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # No -PwithCamera here: this is the PUBLIC build. The camera module
        # embeds the proprietary Insta360 SDK, which must never appear in a
        # world-downloadable artifact — the android-latest release stays
        # SDK-free. The camera build happens below, artifact-only.
        run: gradle -PwithApp :app:assembleRelease :app:assembleDebug --console=plain
      - name: Rename with commit
        run: cp android/app/build/outputs/apk/release/app-release.apk
          "mcft-site-photos-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-site-photos-apk
          path: mcft-site-photos-*.apk
          retention-days: 30

      # The phone's door. An Actions artifact needs a GitHub login, arrives
      # zipped, and expires in 30 days — the wrong shape for "open this link
      # on the phone and tap install". A rolling release gives one permanent
      # URL that always serves the newest main build:
      #   https://github.com/malletcraft/mallet_estimator/releases/download/android-latest/mcft-site-photos.apk
      # main only: batch-next builds are for review, not for phones.
      - name: Publish to the android-latest release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mcft-site-photos-*.apk mcft-site-photos.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "MCFT Site Photos (sideload, rolling)" \
              --notes "Always the newest main build. Same signature every build, so it installs over the previous one."
          gh release upload android-latest mcft-site-photos.apk --clobber
          gh release edit android-latest \
            --notes "Always the newest main build (currently ${GITHUB_SHA::7}, $(date -u +%Y-%m-%dT%H:%MZ)). Same signature every build, so it installs over the previous one."

      # Straight into the managed-Play private app, no human upload. The
      # Android Publisher API can UPDATE an app but not create one, so the
      # very first version goes up by hand in the admin console; every
      # version after that lands here. Gated on the service-account secret:
      # absent means Play publishing is not wired yet, and the GitHub release
      # above remains the delivery channel — noted loudly, never silently.
      - name: Is Play publishing configured?
        id: play
        if: github.ref == 'refs/heads/main'
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play publish, GitHub release is the only channel this build"
          fi
      - name: Publish to Google Play (production track)
        if: github.ref == 'refs/heads/main' && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.malletcrafts.sitephotos
          releaseFiles: mcft-site-photos.apk
          track: production
          status: completed

      # ---- The camera build. The Insta360 SDK is licensed to MCFT and is
      # parked in a PRIVATE Drive folder the mcft-erpnext-drive service
      # account can read. It is fetched at build time, never committed, and
      # the resulting APK is uploaded ONLY as an Actions artifact (GitHub
      # login required) — never to the public android-latest release.
      - name: Fetch the Insta360 SDK from private Drive
        id: sdk
        env:
          SA_JSON: ${{ secrets.MCFT_GDRIVE_SA_JSON }}
          SDK_FILE_ID: 14URjMZ3IFGhcVdsOo6U2wzYbW8wwCPN6
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MCFT_GDRIVE_SA_JSON not set — skipping the camera build"
            exit 0
          fi
          pip -q install google-auth requests
          # The value may be base64 of the SA JSON or the raw JSON — mirror
          # drive_client.load_credentials. A bad value must NOT sink the
          # public APK pipeline: warn loudly, skip the camera build, exit 0.
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.raw"
          if ! python3 - <<'PY'
          import base64, json, os, requests
          raw = open(os.environ["RUNNER_TEMP"] + "/sa.raw").read().strip()
          try:
              data = json.loads(base64.b64decode(raw, validate=True))
          except Exception:
              try:
                  data = json.loads(raw)
              except Exception:
                  # Diagnose without leaking: shape only, never content.
                  looks = "asterisks/masked" if set(raw) <= {"*"} else (
                      "json-ish" if raw[:1] == "{" else "neither json nor base64")
                  print(f"::error::MCFT_GDRIVE_SA_JSON is unusable: {len(raw)} chars, "
                        f"looks like {looks}. The FC dashboard MASKS secret values — "
                        "copy the original service-account .json key file instead "
                        "(or mint a new key in GCP IAM).")
                  raise SystemExit(1)
          with open(os.environ["RUNNER_TEMP"] + "/sa.json", "w") as f:
              json.dump(data, f)
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds = service_account.Credentials.from_service_account_file(
              os.environ["RUNNER_TEMP"] + "/sa.json",
              scopes=["https://www.googleapis.com/auth/drive.readonly"])
          creds.refresh(Request())
          fid = os.environ["SDK_FILE_ID"]
          r = requests.get(
              f"https://www.googleapis.com/drive/v3/files/{fid}?alt=media",
              headers={"Authorization": f"Bearer {creds.token}"}, stream=True, timeout=600)
          r.raise_for_status()
          out = os.environ["RUNNER_TEMP"] + "/insta-sdk.zip"
          with open(out, "wb") as f:
              for chunk in r.iter_content(1 << 20):
                  f.write(chunk)
          print("downloaded", os.path.getsize(out), "bytes")
          PY
          then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::camera build skipped — MCFT_GDRIVE_SA_JSON unusable or Drive fetch failed (see above)"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/insta-sdk"
          unzip -q "$RUNNER_TEMP/insta-sdk.zip" -d "$RUNNER_TEMP/insta-sdk"
          # The zip is Insta360's DEMO PROJECT — the SDK itself resolves from
          # their private Maven, whose URL, credentials and versions live in
          # the demo's gradle files. Parse them out and hand them to gradle
          # via env. The password is MASKED before anything else happens:
          # this repo's CI logs are public.
          if python3 - <<'PY'
          import os, re, sys, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "insta-sdk"
          text = ""
          for pat in ("settings.gradle*", "build.gradle*", "gradle.properties"):
              for f in root.rglob(pat):
                  if "__MACOSX" not in str(f):
                      text += f.read_text(errors="ignore") + "\n"
          # Only the CREDENTIALS are taken from the zip (they are the licensed
          # part). Repo URL and coordinates are public and hardcoded in the
          # build. Password masked before anything else — public logs.
          pw = re.search(r'password\s*[=(:]\s*["\']([^"\']+)', text)
          user = re.search(r'username\s*[=(:]\s*["\']([^"\']+)', text)
          if not (user and pw):
              print(f"credentials not found in the demo gradle files: "
                    f"user={bool(user)} pw={bool(pw)}")
              sys.exit(1)
          print(f"::add-mask::{pw.group(1)}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"INSTA_MVN_USER={user.group(1)}\n")
              f.write(f"INSTA_MVN_PASS={pw.group(1)}\n")
          print("maven credentials extracted")
          PY
          then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::camera build skipped — could not extract SDK maven coordinates from the zip (listing above)"
            exit 0
          fi
      - name: Assemble the camera build (artifact-only, embeds the SDK)
        if: steps.sdk.outputs.present == 'true'
        working-directory: android
        env:
          MCFT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -PwithApp -PwithCamera :app:assembleRelease --console=plain
      # The camera module contributes android:networkSecurityConfig to the
      # app's <application> through manifest merging, and a merge that
      # silently drops it would look EXACTLY like the camera failing to
      # connect for some other reason — cleartext to 192.168.42.1 blocked,
      # no error naming the cause. So assert it on the merged manifest that
      # actually goes into the APK, not on the source file that expresses
      # the intent.
      - name: The shipped camera manifest permits cleartext to the X3
        if: steps.sdk.outputs.present == 'true'
        working-directory: android
        run: |
          M=$(find app/build/intermediates -name AndroidManifest.xml \
                -path '*merged_manifest*release*' | head -1)
          if [ -z "$M" ]; then
            echo "::error::no merged release manifest found — cannot verify \
          the cleartext config reached the APK"; exit 1
          fi
          echo "merged manifest: $M"
          grep -q 'networkSecurityConfig' "$M" || {
            echo "::error::the camera build's merged manifest has NO \
          networkSecurityConfig. camera/src/main/AndroidManifest.xml declares \
          it; the merger dropped it (most likely the app manifest now sets \
          its own). Without it Android blocks the SDK's plain-HTTP calls to \
          the camera and every connect fails."; exit 1; }
          grep -q '192.168.42.1' camera/src/main/res/xml/network_security_config.xml || {
            echo "::error::the network security config no longer names the \
          X3's address"; exit 1; }
          echo "cleartext to 192.168.42.1 is permitted in the shipped manifest"
      # The OTA leg: every green camera build lands in the private Drive
      # releases folder with a manifest; the bench mirrors it and phones
      # self-update from inside the app. main only — batch-next camera
      # builds are for review.
      - name: Publish camera build to the private OTA channel
        if: steps.sdk.outputs.present == 'true' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds = service_account.Credentials.from_service_account_file(
              os.environ["RUNNER_TEMP"] + "/sa.json",
              scopes=["https://www.googleapis.com/auth/drive"])
          creds.refresh(Request())
          H = {"Authorization": f"Bearer {creds.token}"}
          API = "https://www.googleapis.com/drive/v3"
          UP = "https://www.googleapis.com/upload/drive/v3"
          # The handover root — the service account organises this tree. It
          # lives in a SHARED DRIVE, and shared-drive items are invisible to
          # the API unless every call carries supportsAllDrives (run 47
          # failed exactly here: find() saw nothing, create got refused).
          parent = "1ySA5wEDX_3YdCBqxrlxt6lX1I6uDIcKI"
          SD = {"supportsAllDrives": "true"}
          def find(name, folder):
              q = f"name = '{name}' and '{folder}' in parents and trashed = false"
              r = requests.get(f"{API}/files", params={
                  "q": q, "fields": "files(id)",
                  "includeItemsFromAllDrives": "true", **SD}, headers=H)
              r.raise_for_status()
              hits = r.json().get("files", [])
              return hits[0]["id"] if hits else None
          folder = find("MCFT App Releases (private)", parent)
          if not folder:
              r = requests.post(f"{API}/files", params=SD, headers=H, json={
                  "name": "MCFT App Releases (private)",
                  "mimeType": "application/vnd.google-apps.folder",
                  "parents": [parent]})
              r.raise_for_status()
              folder = r.json()["id"]
          vn, vc = os.environ["MCFT_VERSION_NAME"], os.environ["MCFT_VERSION_CODE"]
          apk_name = "mcft-site-photos-camera-latest.apk"
          data = open("android/app/build/outputs/apk/release/app-release.apk", "rb").read()
          fid = find(apk_name, folder)
          init = dict(H, **{"X-Upload-Content-Type": "application/octet-stream"})
          if fid:
              r = requests.patch(f"{UP}/files/{fid}?uploadType=resumable",
                                 params=SD, headers=init, json={})
          else:
              r = requests.post(f"{UP}/files?uploadType=resumable",
                                params=SD, headers=init,
                                json={"name": apk_name, "parents": [folder]})
          r.raise_for_status()
          requests.put(r.headers["Location"], data=data,
                       headers={"Content-Type": "application/octet-stream"}
                       ).raise_for_status()
          manifest = json.dumps({"version_name": vn, "version_code": int(vc),
                                 "apk": apk_name})
          mid = find("camera-latest.json", folder)
          if mid:
              requests.patch(f"{UP}/files/{mid}?uploadType=media", params=SD,
                             headers=H, data=manifest).raise_for_status()
          else:
              b = "xxMCFTxx"
              body = (f"--{b}\r\nContent-Type: application/json\r\n\r\n"
                      + json.dumps({"name": "camera-latest.json", "parents": [folder]})
                      + f"\r\n--{b}\r\nContent-Type: application/json\r\n\r\n"
                      + manifest + f"\r\n--{b}--")
              requests.post(f"{UP}/files?uploadType=multipart", params=SD,
                            headers={**H, "Content-Type":
                                     f"multipart/related; boundary={b}"},
                            data=body).raise_for_status()
          print(f"OTA channel now serves {vn} (vc {vc}), {len(data)} bytes")
          PY

      # TEMPORARY diagnostic while the bridge is being wired: when the
      # camera compile fails, print the exact callback signatures V1.10.1
      # ships — javap over the AARs gradle already resolved into its cache.
      # Public API shapes only; no credentials involved.
      - name: SDK callback signatures (on compile failure)
        if: failure() && steps.sdk.outputs.present == 'true'
        run: |
          for a in sdkcamera sdkmedia; do
            aar=$(find ~/.gradle/caches -name "$a-1.10.1*.aar" | head -1)
            [ -n "$aar" ] || { echo "$a aar not in cache"; continue; }
            d="$RUNNER_TEMP/$a-x"; mkdir -p "$d"; unzip -o -q "$aar" -d "$d" || true
          done
          javap -classpath "$RUNNER_TEMP/sdkcamera-x/classes.jar" \
            com.arashivision.sdkcamera.camera.callback.ICameraChangedCallback \
            com.arashivision.sdkcamera.camera.callback.ICaptureStatusListener || true
          javap -classpath "$RUNNER_TEMP/sdkmedia-x/classes.jar" \
            com.arashivision.sdkmedia.export.IExportCallback || true
      # Prints what a phone checks before installing: cert fingerprint,
      # version, min/target sdk, native ABIs — plus sha256 to compare against
      # a downloaded copy. Diagnosing "App wasn't installed" without a device.
      - name: Verify the camera APK (certs, badging, sha256)
        if: steps.sdk.outputs.present == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
          sha256sum "$APK"
          ls -la "$APK"
      - name: Upload the camera APK (Actions artifact only — NOT the public release)
        if: steps.sdk.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-site-photos-camera-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
