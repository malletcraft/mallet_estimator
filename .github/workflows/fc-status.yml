name: FC status (read-only)

# Manual, read-only probe of the Frappe Cloud deploy state — does NOT trigger a
# deploy. Use it to see whether a deploy is in progress / a pipeline is stuck and
# what commit the bench currently carries.
on:
  workflow_dispatch:
    inputs:
      agent_job:
        description: "Optional Agent Job name - prints its steps and traceback"
        required: false
        default: ""

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query Frappe Cloud deploy_information
        env:
          FC_HOST: ${{ vars.FC_HOST != '' && vars.FC_HOST || 'cloud.frappe.io' }}
          FC_BENCH: ${{ vars.FC_BENCH != '' && vars.FC_BENCH || 'bench-44687' }}
          FC_KEY: ${{ secrets.FRAPPE_CLOUD_API_KEY }}
          FC_SECRET: ${{ secrets.FRAPPE_CLOUD_API_SECRET }}
        run: |
          set -euo pipefail
          resp=$(curl -sSL -X POST "https://$FC_HOST/api/method/press.api.bench.deploy_information" \
            -H "Authorization: token $FC_KEY:$FC_SECRET" -H "Content-Type: application/json" \
            -d "{\"name\":\"$FC_BENCH\"}")
          echo "$resp" | jq '{
            deploy_in_progress: .message.deploy_in_progress,
            bench_creation_underway: .message.bench_creation_underway,
            has_running_release_pipeline: .message.has_running_release_pipeline,
            update_available: .message.update_available,
            last_deploy: .message.last_deploy,
            mallet_estimator: (.message.apps[]? | select(.app=="mallet_estimator")
              | {current_hash, current_tag, next_release, update_available})
          }'

      # A deploy that builds green but never moves the site fails INSIDE a site
      # agent job (Update Site / Migrate Site), whose traceback is otherwise
      # only on the dashboard. Surface the recent jobs and the failed one's
      # step output here, so a stalled deploy can be diagnosed without a human
      # opening the FC dashboard.
      - name: Recent site agent jobs (+ failed job detail)
        env:
          FC_HOST: ${{ vars.FC_HOST != '' && vars.FC_HOST || 'cloud.frappe.io' }}
          FC_SITE: ${{ vars.FC_SITE != '' && vars.FC_SITE || 'mcft-stg.frappe.cloud' }}
          FC_KEY: ${{ secrets.FRAPPE_CLOUD_API_KEY }}
          FC_SECRET: ${{ secrets.FRAPPE_CLOUD_API_SECRET }}
        # Best-effort: team API keys are refused by some press job endpoints
        # ("API access not permitted"), so every probe here tolerates failure
        # and the step never turns the run red — the bench probe above is the
        # authoritative part of this workflow.
        continue-on-error: true
        run: |
          set -uo pipefail
          probe() {  # probe <method> <json-body>
            echo "--- $1 $2"
            curl -sSL --max-time 30 -X POST "https://$FC_HOST/api/method/$1" \
              -H "Authorization: token $FC_KEY:$FC_SECRET" -H "Content-Type: application/json" \
              -d "$2" | head -c 4000; echo
          }
          probe press.api.site.jobs "{\"name\":\"$FC_SITE\",\"start\":0}"
          probe press.api.site.get "{\"name\":\"$FC_SITE\"}"
          probe press.api.site.overview "{\"name\":\"$FC_SITE\"}"
          probe press.api.client.get_list "{\"doctype\":\"Agent Job\",\"filters\":{\"site\":\"$FC_SITE\"},\"fields\":[\"name\",\"job_type\",\"status\",\"creation\"],\"limit\":8,\"order_by\":\"creation desc\"}"
      - name: Agent job detail (when asked)
        if: github.event.inputs.agent_job != ''
        env:
          FC_HOST: ${{ vars.FC_HOST != '' && vars.FC_HOST || 'cloud.frappe.io' }}
          FC_KEY: ${{ secrets.FRAPPE_CLOUD_API_KEY }}
          FC_SECRET: ${{ secrets.FRAPPE_CLOUD_API_SECRET }}
          JOB: ${{ github.event.inputs.agent_job }}
        run: |
          set -uo pipefail
          # The steps of one agent job carry the output/traceback of a
          # failed migrate - the only surviving record after FC rolls the
          # site back.
          # Full doc read of the parent job (list on Agent Job is allowed,
          # so the doc read usually is too) — steps ride inside it.
          curl -sSL --max-time 30 -X POST "https://$FC_HOST/api/method/press.api.client.get" \
            -H "Authorization: token $FC_KEY:$FC_SECRET" -H "Content-Type: application/json" \
            -d "{\"doctype\":\"Agent Job\",\"name\":\"$JOB\"}" | head -c 40000; echo
