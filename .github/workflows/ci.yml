name: CI (tests)

# Automated test suite for the app:
#   • unit        — fast, pure-Python (cost engine + OpenCutList parser), no DB.
#   • integration — spins up Frappe v16 + ERPNext, installs mallet_estimator, and
#                   runs `bench run-tests` (masters/config health-check, inventory
#                   Items + UOMs + warehouses, and the Estimate SKU flow).
on:
  push:
    # batch-next as well as main. Development happens on batch-next, and a
    # branch CI does not watch is a branch where red sits unnoticed until
    # somebody merges it (2026-08-21: a batch sat red for an hour because
    # nothing had tested it). Deploys still only follow main.
    branches: [main, batch-next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pure-test deps
        run: pip install numpy pillow
      - name: Run pure unit tests
        run: python -m unittest mallet_estimator.tests.test_estimator mallet_estimator.tests.test_opencutlist mallet_estimator.tests.test_nesting mallet_estimator.tests.test_consolidate mallet_estimator.tests.test_repair mallet_estimator.tests.test_panorama mallet_estimator.tests.test_handover mallet_estimator.tests.test_drive_sync mallet_estimator.tests.test_worksite -v

  projection:
    name: Projection contract (device vs bench)
    runs-on: ubuntu-latest
    # The 360 → faces projection exists TWICE: Python on the bench, Kotlin on
    # the phone — because a site has no signal, and a face that must reach a
    # server first is a face ImageMeter never sees while anyone is still in
    # the room. Two implementations of one formula drift silently: nobody
    # notices a face two degrees off, they measure the wrong wall months
    # later. This job is what makes the contract binding rather than a good
    # intention. No Android SDK required — the module is pure JVM on purpose.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin projection must match the published goldens
        working-directory: android
        run: gradle :pano:test --console=plain

  integration:
    name: Integration (Frappe v16 + ERPNext)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - name: Clone app
        uses: actions/checkout@v4
        with:
          path: mallet_estimator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # Frappe v16.29 pins Python >=3.14,<3.15
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # Frappe v16 requires node >=24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev redis-server mariadb-client
          sudo npm install -g yarn

      - name: Configure MariaDB for Frappe (utf8mb4)
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4';"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench + get apps
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" frappe-bench
          cd frappe-bench
          bench get-app erpnext --branch version-16 --resolve-deps
          # ERPNext v16 split payments into its own app; the Payment Gateway
          # doctype it provides is referenced when creating parties.
          bench get-app payments --branch version-16 || bench get-app payments
          bench get-app mallet_estimator "${GITHUB_WORKSPACE}/mallet_estimator"

      - name: Create test site + install apps
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site test_site \
            --db-root-password root --admin-password admin \
            --no-mariadb-socket --verbose
          bench --site test_site install-app erpnext
          bench --site test_site install-app payments || true
          bench --site test_site install-app mallet_estimator

      - name: Run tests
        working-directory: frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          # ERPNext seeds core records (Warehouse Types, UOMs) partly through
          # background jobs on fresh sites; on fast runners the tests can start
          # before that settles ('Could not find Warehouse Type: Transit',
          # 2026-08-13, intermittent). Make the seed deterministic first.
          bench --site test_site execute mallet_estimator.install.ensure_core_seed
          set -o pipefail
          bench --site test_site run-tests --app mallet_estimator 2>&1 \
            | tee /tmp/mallet-tests.log

      # A run prints ~1700 lines, the last 500 of which are the UNIT phase
      # passing and the service containers shutting down. The integration
      # failure sits a thousand lines above that, past what any log tail
      # reaches — so a red run said "OK" at the bottom and told you nothing
      # (2026-08-17, twice). Pull the failures out and put them at the end.
      - name: What actually failed
        if: failure()
        run: |
          # Strip ANSI first. The runner colours its result lines, so a plain
          # ^FAIL: pattern matches nothing and the traceback section comes out
          # empty — which is how the first version of this step reported a
          # failure it had successfully found (2026-08-17).
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/mallet-tests.log > /tmp/plain.log
          echo "===== summary ====="
          # Frappe's runner prints " FAIL  test_x (mod.Class.test_x)" -- leading
          # space, no colon -- while plain unittest prints "FAIL: test_x". The
          # old pattern anchored on "^FAIL:" and so matched NEITHER, which is
          # how a red run came back with an empty summary and no annotations
          # (2026-08-21). Both shapes now.
          grep -nE "^[[:space:]]*(FAIL|ERROR)[[:space:]:]+[A-Za-z_]|^Ran [0-9]+ tests|^(FAILED|OK)" \
            /tmp/plain.log || echo "(no unittest summary lines found)"

          # Also as ANNOTATIONS. A red run's log is ~4000 lines and the
          # runner appends ~250 lines of service-container noise after the
          # last step, so the failure names are unreachable from any
          # reasonable tail — twice now they have had to be dug out by
          # fetching hundreds of lines. An ::error:: line lands in the check
          # run itself, where one small API call reads it.
          grep -E "^[[:space:]]*(FAIL|ERROR)[[:space:]:]+[A-Za-z_]" /tmp/plain.log \
            | while read -r line; do
            echo "::error title=mallet tests::${line}"
          done

          # And the TRACEBACK, not just the name. A test name says which one
          # broke; only the assertion says why, and without it a red build
          # costs a round-trip per guess. On 2026-08-23 one test took four
          # rounds — the answer turned out to be "erp:assumed" vs "assumed",
          # which the message would have given away immediately.
          #
          # Newlines are escaped as %0A because that is the only way an
          # annotation carries more than one line.
          python3 - <<'EOF' || true
          import re
          log = open('/tmp/plain.log', errors='replace').read()
          lines = log.splitlines()
          blocks = []
          for i, l in enumerate(lines):
              if not re.match(r'^[ \t]*(FAIL|ERROR)[ :\t]+\S', l):
                  continue
              # From the header down to the next rule or the run summary. An
              # earlier version used a lookahead and stopped at the ---- rule
              # printed immediately UNDER the header, so it captured the name
              # and nothing else -- the exact thing this step exists to add.
              block = [l]
              for nxt in lines[i + 1:i + 40]:
                  if re.match(r'^={20,}\s*$', nxt):
                      break
                  if re.match(r'^(Ran \d+ test|OK\b|FAILED\b)', nxt):
                      break
                  block.append(nxt)
              blocks.append("\n".join(block).strip())
          for b in blocks[:10]:
              body = b[:3500]
              first = body.splitlines()[0][:110]
              print("::error title=%s::%s" % (
                  first, body.replace('%', '%25')
                             .replace('\r', '')
                             .replace('\n', '%0A')))
          EOF
          echo
          echo "===== integration phase (runs first, where failures land) ====="
          # The integration phase finishes long before the unit phase, so its
          # output is unreachable from any tail of the job log.
          sed -n "1,$(grep -n '^Ran [0-9]* tests' /tmp/plain.log | head -1 \
            | cut -d: -f1)p" /tmp/plain.log | tail -120

      - name: Show error logs on failure
        if: failure()
        working-directory: frappe-bench
        run: |
          echo "===== recent Error Log ====="
          bench --site test_site execute frappe.client.get_list \
            --kwargs '{"doctype": "Error Log", "fields": ["method"], "limit_page_length": 5, "order_by": "creation desc"}' 2>/dev/null || true
